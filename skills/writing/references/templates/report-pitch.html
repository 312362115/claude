<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{REPORT_TITLE}}</title>
  <!--
    深色路演型 — HTML 组件示例集（不是模板，不要照填）
    用法：从 references/components.md 选组件，对照本文件看每个组件的 HTML 实现

    本文件提供的组件：
      - Hero（A1）+ Eyebrow（A2）+ Pill（A3）+ TOC（A4）— 顶部冲击型
      - section-head + section-index + summary（B1）— 章节双栏头
      - Figure + caption（C1）— 图片画框
      - Card-Grid grid-2 / grid-3 / grid-4（C2）— 卡片网格
      - Decision-Card 三色（D1）— 决策/风险卡（青绿/橙/粉红）
      - 表格（C3）— 评审对照表

    什么时候用本文件的组件？
      - 内容含 ≥ 3 张架构/流程图（适合 figure-first）
      - 需要投屏路演（深色背景对屏幕友好）
      - 评审场景（章节双栏头帮评审人扫读）
      - 决策密集型（Decision-Card 三色信号化）

    什么时候不用？
      - 内部 spec / plan / API 文档 — 用 Markdown
      - 数据汇报为主（指标卡 / 进度条占大部分）— 改用 report-template.html 浅色组件集
      - 短文档 / 单图说明 — 不需要 hero

    占位符（按需替换、按需删除）：
      {{REPORT_TITLE}}     主标题
      {{REPORT_SUBTITLE}}  副标题（一句话讲清核心命题）
      {{EYEBROW}}          顶部小标（可省）
  -->
  <style>
    :root {
      --bg: #07090d;
      --panel: #101620;
      --panel-2: #151d2a;
      --text: #eef4ff;
      --muted: #9fafc7;
      --line: #26354a;
      --blue: #4a8dff;
      --teal: #19b8a6;
      --green: #26b970;
      --orange: #ff9b2f;
      --rose: #ff5b78;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 20% -10%, rgba(74, 141, 255, .20), transparent 32rem),
        radial-gradient(circle at 100% 10%, rgba(25, 184, 166, .16), transparent 28rem),
        linear-gradient(180deg, #07090d 0%, #0a0f17 48%, #07090d 100%);
    }

    a { color: inherit; }

    .deck {
      width: min(1760px, calc(100vw - 64px));
      margin: 0 auto;
      padding: 36px 0 80px;
    }

    /* ─── Hero ─── */
    .hero {
      min-height: 72vh;
      display: grid;
      align-content: center;
      gap: 32px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      color: var(--teal);
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 1180px;
      margin: 0;
      font-size: clamp(42px, 6vw, 92px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 22px;
      font-size: clamp(30px, 3.1vw, 58px);
      letter-spacing: 0;
    }

    h3 {
      margin: 0 0 14px;
      font-size: clamp(20px, 1.4vw, 30px);
    }

    .lead {
      max-width: 980px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(18px, 1.5vw, 28px);
      line-height: 1.7;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .pill {
      padding: 10px 16px;
      color: #dce9ff;
      background: rgba(74, 141, 255, .12);
      border: 1px solid rgba(74, 141, 255, .28);
      border-radius: 999px;
      font-weight: 700;
    }

    /* ─── Section ─── */
    .section {
      padding: 56px 0 68px;
      border-bottom: 1px solid var(--line);
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 32px;
      margin-bottom: 26px;
    }

    .section-index {
      color: var(--blue);
      font-size: clamp(18px, 1.4vw, 26px);
      font-weight: 900;
    }

    .summary {
      max-width: 900px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    /* ─── Figure（图为主） ─── */
    .figure {
      margin: 0;
      width: 100%;
      padding: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 22px;
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
    }

    .stacked-figure {
      margin-top: 24px;
    }

    .figure img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
      background: #f7faff;
    }

    .caption {
      margin-top: 12px;
      color: var(--muted);
      font-size: 15px;
    }

    /* ─── Grid ─── */
    .grid-2 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px;
      margin-top: 22px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 22px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      margin-top: 22px;
    }

    .card {
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .card strong {
      display: block;
      margin-bottom: 8px;
      color: #ffffff;
      font-size: 20px;
    }

    .card span, .card li {
      color: var(--muted);
      line-height: 1.65;
    }

    ul {
      margin: 10px 0 0;
      padding-left: 18px;
    }

    /* ─── Decision Card（决策/风险卡） ─── */
    .decision {
      border-left: 4px solid var(--teal);
      background: linear-gradient(90deg, rgba(25,184,166,.14), rgba(25,184,166,.04));
    }
    .decision-warn {
      border-left: 4px solid var(--orange);
      background: linear-gradient(90deg, rgba(255,155,47,.14), rgba(255,155,47,.04));
    }
    .decision-risk {
      border-left: 4px solid var(--rose);
      background: linear-gradient(90deg, rgba(255,91,120,.14), rgba(255,91,120,.04));
    }

    /* ─── Table ─── */
    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      margin-top: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    th, td {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      line-height: 1.55;
    }

    th {
      color: #ddecff;
      background: var(--panel-2);
      font-size: 16px;
    }

    td { color: var(--muted); }
    tr:last-child td { border-bottom: 0; }

    /* ─── TOC Chips（顶部章节快跳） ─── */
    .toc {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-top: 12px;
      max-width: 1120px;
    }

    .toc a {
      display: block;
      padding: 16px 18px;
      color: #dce9ff;
      text-decoration: none;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 16px;
    }

    .toc a:hover {
      border-color: rgba(74,141,255,.55);
      background: rgba(74,141,255,.16);
    }

    /* ─── Responsive ─── */
    @media (max-width: 900px) {
      .deck { width: min(100vw - 28px, 1760px); }
      .hero { min-height: auto; padding: 44px 0; }
      .section { padding: 40px 0 48px; }
      .section-head { display: block; }
      .grid-2, .grid-3, .grid-4, .toc { grid-template-columns: 1fr; }
      .figure { padding: 8px; border-radius: 16px; }
    }

    /* ─── Print（每节自动分页，便于打印评审材料） ─── */
    @media print {
      body { background: #fff; color: #111827; }
      .deck { width: 100%; padding: 0; }
      .section, .hero { page-break-after: always; border-bottom: 0; }
      .card, table, .figure { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main class="deck">

    <!-- ═══ Hero（一屏建立全局认知） ═══ -->
    <section class="hero">
      <div class="eyebrow">{{EYEBROW}}</div>
      <h1>{{REPORT_TITLE}}</h1>
      <p class="lead">{{REPORT_SUBTITLE}}</p>
      <div class="meta-row">
        <!-- pills：5-8 个关键词芯片，强化方案定位 -->
        <span class="pill">关键词1</span>
        <span class="pill">关键词2</span>
        <span class="pill">关键词3</span>
        <span class="pill">关键词4</span>
        <span class="pill">关键词5</span>
      </div>
      <nav class="toc">
        <!-- 4 个章节锚点，路演时一键跳转 -->
        <a href="#overview">总体架构</a>
        <a href="#runtime">运行链路</a>
        <a href="#orchestration">核心编排</a>
        <a href="#risk">风险决策</a>
      </nav>
    </section>

    <!-- ═══ Section 模板（figure-first 模式） ═══

      <section id="overview" class="section">
        <div class="section-head">
          <div>
            <div class="section-index">01</div>
            <h2>章节标题</h2>
          </div>
          <p class="summary">一句话讲清这一章在干嘛（出现在右侧，不看正文也能扫读）</p>
        </div>

        <figure class="figure">
          <img src="./assets/xxx.png" alt="..." />
          <figcaption class="caption">补充说明（可选）</figcaption>
        </figure>

        <!-- 可选：跟图后用网格卡片补充关键点 -->
        <div class="grid-2">
          <div class="card decision">
            <strong>核心决策</strong>
            <span>用 decision/decision-warn/decision-risk 区分性质</span>
          </div>
          <div class="card">
            <strong>关键反馈</strong>
            <span>非决策类放普通 card</span>
          </div>
        </div>

        <!-- 可选：评审表格（评审关注 vs 当前方案） -->
        <table>
          <thead><tr><th>评审关注</th><th>当前方案</th></tr></thead>
          <tbody>
            <tr><td>...</td><td>...</td></tr>
          </tbody>
        </table>
      </section>
    -->

    <!-- ═══ Decision Card 三色用法 ═══

      .decision      → 已决策/已选方案（青绿色）
      .decision-warn → 待观察/有约束（橙色）
      .decision-risk → 风险点/未决问题（粉红色）

      用色规则：路演场景里"颜色 = 信号"，混用会失效。
    -->

    <!-- ═══ Grid 选择 ═══

      grid-2 → 对照（A vs B）、决策对（已选 / 备选）
      grid-3 → 三段式（输入 / 处理 / 输出）、Agent 角色分工
      grid-4 → 阶段路线（短/中/长）、能力矩阵
    -->

  </main>
</body>
</html>
